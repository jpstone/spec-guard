name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit and CLI tests
        run: node --test

      - name: Smoke check valid fixture
        run: node bin/spec-guard.js check test/fixtures/valid-spec.md

      - name: Validate all example specs
        run: |
          for f in examples/*/spec.md; do
            echo "Checking $f..."
            node bin/spec-guard.js check "$f" --warnings || true
          done
