name: Spec Guard

on:
  push:
    paths:
      - '.spec-guard/specs/**'
  pull_request:
    paths:
      - '.spec-guard/specs/**'

jobs:
  validate-specs:
    name: Validate specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --save-dev @jpstone/spec-guard
      - run: npx spec-guard validate
